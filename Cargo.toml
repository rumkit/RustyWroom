[package]
name = "rusty-wroom"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# The HAL: GPIO, clocks, timers, etc. The "esp32" feature selects the chip.
# "unstable" unlocks drivers whose API may still change, e.g. LEDC (PWM).
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }

# Chip-independent hardware traits; esp-hal implements them (e.g. SetDutyCycle).
embedded-hal = "1.0.0"

# Runtime for async code: runs the Embassy executor and drives embassy-time
# from a hardware timer. Provides the #[esp_rtos::main] entry point.
# "esp-radio" + "esp-alloc": also provide the threads/queues/heap the WiFi
# driver needs.
esp-rtos = { version = "0.4.0", features = ["esp32", "embassy", "esp-radio", "esp-alloc"] }

# WiFi/BLE driver (wraps Espressif's precompiled radio firmware blobs).
esp-radio = { version = "1.0.0-beta.1", features = ["esp32", "wifi"] }

# Heap allocator: the WiFi driver allocates buffers at runtime, so unlike the
# earlier examples this one needs a heap.
esp-alloc = { version = "0.11.0", features = ["esp32"] }

# TCP/IP stack (smoltcp underneath): IP, ARP, UDP and TCP sockets on top of
# the WiFi interface. Only the protocol pieces we use are compiled in:
# dhcpv4 (client), dns and icmp (ping) are for wifi_probe. Features apply to
# every binary in the package, so wifi_led gets them too.
embassy-net = { version = "0.9.1", features = ["proto-ipv4", "medium-ethernet", "tcp", "udp", "dhcpv4", "dns", "icmp"] }

# DHCP server, so a phone joining our access point gets an IP address.
edge-dhcp = "0.8.0"
# edge-dhcp talks to the network through edge-nal traits; edge-nal-embassy
# implements them on top of embassy-net's UDP sockets.
edge-nal = "0.7"
# DNS server that answers every name with our own IP (captive portal).
edge-captive = "0.8.0"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["proto-ipv4", "medium-ethernet", "udp"] }

# The async executor's task macro and Spawner (esp-rtos supplies the executor
# itself, so no arch-* feature here).
embassy-executor = "0.10.0"

# Async timers: Timer::after(...).await.
embassy-time = "0.5.1"

# Combinators for futures, e.g. select(a, b): wait for whichever finishes first.
embassy-futures = "0.1.2"

# Fixed-capacity collections (String<N>, Vec<T, N>) that live on the stack or
# in statics instead of the heap.
heapless = "0.9"

# Atomics with extra types/ops; esp-hal accepts its AtomicU32 in persistent
# RTC memory (the wake counter in wifi_probe).
portable-atomic = { version = "1.11", default-features = false }

# Safe one-time initialization of a `static`, yielding a &'static mut to it.
static_cell = "2.1.1"

# Heap-free primitives for talking between tasks (Watch, Signal, Channel...).
# Same version esp-hal uses, so only one copy gets compiled.
embassy-sync = "0.8.0"

# Provides the app descriptor the ESP-IDF 2nd-stage bootloader expects.
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }

# println! over the UART that espflash's monitor shows.
esp-println = { version = "0.18.0", features = ["esp32"] }

# Panic handler that prints a backtrace via esp-println.
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }

critical-section = "1.2.0"

[profile.dev]
# Unoptimized embedded code is huge and slow; always optimize a bit.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# The radio driver needs opt-level 2 or 3, otherwise WiFi may fail to connect
# (per the esp-radio docs). Everything else stays size-optimized.
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3

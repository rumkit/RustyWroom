# Template for local secrets. Copy to secrets.toml (git-ignored) next to this
# file and fill in the values; .cargo/config.toml includes it if present.
# Read in code with env!("NAME").

[env]
# Home WiFi to join (2.4 GHz, WPA2).
RUSTYWROOM_SSID = ""
RUSTYWROOM_PASSWORD = ""
# Host the probe pings: an IP ("192.168.1.1") or a DNS name ("google.com",
# or a name your router knows). mDNS names (*.local) won't resolve.
RUSTYWROOM_PROBE_HOST = ""

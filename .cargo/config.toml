# secrets.toml is git-ignored and optional, so the binaries that don't need
# WiFi credentials still build without it (see secrets.example.toml).
include = ["esp-config.toml", { path = "secrets.toml", optional = true }]

[target.xtensa-esp32-none-elf]
# `cargo run` builds, flashes over the serial port, then opens a serial monitor.
runner = "espflash flash --monitor --chip esp32 --port COM4"

[build]
rustflags = ["-C", "link-arg=-nostartfiles"]
target = "xtensa-esp32-none-elf"

[unstable]
# core is not shipped prebuilt for Xtensa, so it is compiled from source.
# alloc (Vec, Box, String...) too: the WiFi driver needs a heap.
build-std = ["alloc", "core"]
